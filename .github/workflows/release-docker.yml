name: Stage verified Docker release
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
      input_sha256:
        required: true
        type: string
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag }}
      INPUT_SHA256: ${{ inputs.input_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Build, validate, package and stage draft assets
        run: python3 .github/scripts/release_build.py
