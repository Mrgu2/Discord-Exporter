<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discord 登录助手</title><style>body{font:16px/1.7 system-ui;color:#28384d;background:#f3f6fa;margin:0}main{max-width:580px;margin:8vh auto;padding:36px;background:white;border-radius:14px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbd7e8;border-radius:6px;font:inherit}button,a.button{display:inline-block;font:inherit;padding:9px 15px;margin:14px 8px 0 0;background:#4e70ba;border:0;border-radius:6px;color:white;cursor:pointer;text-decoration:none}button:disabled{opacity:.45}#server,#status{overflow-wrap:anywhere}p{margin:12px 0}small{color:#63738a}[hidden]{display:none!important}</style><main><h1>Discord 登录助手</h1><label for="url">Ubuntu 工作台 HTTPS 地址</label><input id="url" type="url" placeholder="https://服务器.私网.ts.net"><button id="start">连接 Discord 账号</button><a class="button" id="workspace" target="_blank" rel="noopener" hidden>打开 Ubuntu 工作台</a><p id="status" role="status"></p><a class="button" id="authorize" target="_blank" rel="noopener" hidden>打开授权链接</a><label id="browser-choice" hidden>日常已登录 Discord 的浏览器 <select id="normal-browser"></select></label><button id="existing" hidden>使用已登录的日常浏览器绑定</button><button id="login" hidden>备用：专用窗口登录</button><section id="confirm" hidden><p id="account"></p><p id="server"></p><button id="bind">确认绑定此账号</button></section><details><summary>首次加载一次性绑定扩展</summary><p>在日常 Chrome / Edge 的扩展管理页开启开发者模式，点“加载已解压的扩展”，选择包内 Browser Extension 文件夹。绑定后可移除。</p><code id="extension-path"></code></details><p><small>登录在这台电脑的专用临时窗口完成。密码与验证码由本人输入；助手不安装采集服务或模型，关闭后不保留 Discord 登录资料。</small></p></main><script>
const $=id=>document.getElementById(id),key=location.hash.slice(1);history.replaceState(null,'',location.pathname);
async function request(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'X-Assistant-Key':key,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});const s=await r.json();if(!r.ok)throw Error(s.error);return s;}
function render(s){$('browser-choice').hidden=s.phase!=='authorized';if(!$('normal-browser').options.length)for(const name of (s.browsers||[])){const o=document.createElement('option');o.value=name;o.textContent=name==='chrome'?'Chrome':'Edge';$('normal-browser').append(o);}$('extension-path').textContent=s.extension_folder||'';$('existing').hidden=s.phase!=='authorized';$('workspace').hidden=!s.server_url;if(s.server_url)$('workspace').href=s.server_url;$('status').textContent=s.message;if(s.server_url&&!$('url').value)$('url').value=s.server_url;$('url').disabled=!['ready','error','done'].includes(s.phase);$('start').disabled=!['ready','error','done'].includes(s.phase);$('authorize').hidden=s.phase!=='waiting';if(s.authorization_url)$('authorize').href=s.authorization_url;$('login').hidden=s.phase!=='authorized';$('confirm').hidden=s.phase!=='confirm';$('account').textContent='账号：'+(s.account||'');$('server').textContent='服务器：'+s.server_url;}
async function action(path,body){try{render(await request(path,body));}catch(e){$('status').textContent=e.message;}}
$('start').onclick=()=>action('/start',{server_url:$('url').value});$('existing').onclick=()=>action('/existing-browser',{browser:$('normal-browser').value});$('login').onclick=()=>action('/login',{});$('bind').onclick=()=>action('/bind',{});setInterval(()=>action('/status'),1000);action('/status');
</script></html>
